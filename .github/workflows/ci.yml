name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify runner and compiled CLI
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Run contract suite
        run: ./scripts/check.sh

      - name: Build universal release CLI
        run: ./scripts/build-cli.sh release

      - name: Verify universal architectures
        run: |
          binary=$(swift build --configuration release --show-bin-path --arch arm64 --arch x86_64)/xceasyctl
          file "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          "$binary" version
