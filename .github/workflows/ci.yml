name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify runner and compiled CLI
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Install contract check dependencies
        run: brew install ripgrep

      - name: Run contract suite
        run: ./scripts/check.sh

      - name: Build universal release CLI
        run: ./scripts/build-cli.sh release

      - name: Verify universal architectures
        run: |
          binary=$(swift build --configuration release --show-bin-path --arch arm64 --arch x86_64)/xceasyctl
          file "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          "$binary" version
