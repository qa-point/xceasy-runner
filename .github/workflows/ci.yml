name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify runner and compiled CLI
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install contract check dependencies
        run: brew install ripgrep

      - name: Run contract suite
        run: ./scripts/check.sh

      - name: Build universal release CLI
        run: ./scripts/build-cli.sh release

      - name: Verify universal architectures
        run: |
          binary=$(swift build --configuration release --show-bin-path --arch arm64 --arch x86_64)/xceasyctl
          file "$binary"
          lipo "$binary" -verify_arch arm64 x86_64
          "$binary" version
